<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>FGC Cesium Route</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #071526;
        }
        #status {
            position: absolute;
            left: 10px;
            bottom: 10px;
            z-index: 10;
            padding: 5px 8px;
            border: 1px solid rgba(56, 189, 248, 0.55);
            border-radius: 4px;
            background: rgba(7, 21, 38, 0.82);
            color: #d9f3ff;
            font: 600 10px sans-serif;
            letter-spacing: 0.04em;
            pointer-events: none;
        }
        #status.ready {
            opacity: 0;
            transition: opacity 600ms ease;
        }
        #cameraControls {
            position: absolute;
            top: 7px;
            right: 38px;
            z-index: 20;
            display: flex;
            gap: 3px;
        }
        #cameraControls button {
            height: 22px;
            padding: 0 8px;
            border: 1px solid rgba(140, 178, 199, 0.55);
            border-radius: 3px;
            background: rgba(7, 21, 38, 0.82);
            color: #d6e2e8;
            font: 700 9px sans-serif;
            cursor: pointer;
        }
        #cameraControls button.selected {
            background: rgba(56, 189, 248, 0.88);
            color: #071526;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="cameraControls">
        <button type="button" data-camera-mode="overview">OVERVIEW</button>
        <button type="button" data-camera-mode="follow">FOLLOW</button>
        <button type="button" data-camera-mode="auto">AUTO</button>
    </div>
    <div id="status">LOADING 3D MAP</div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="qrc:/qml/Custom/Widgets/Cesium/cesium_route.js"></script>
</body>
</html>
